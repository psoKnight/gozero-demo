Name: generalgateway
Host: 0.0.0.0
Port: 8080
Timeout: 3000
CpuThreshold: 900
Middlewares:
  Breaker: true
  Shedding: true
Greeter:
  Endpoints:
    - 127.0.0.1:50051
  Timeout: 3000
  Middlewares:
    Breaker: true
Calculator:
  Endpoints:
    - 127.0.0.1:50053
  Timeout: 3000
  Middlewares:
    Breaker: true
Resilience:
  HTTPRateLimit:
    enabled: true
    rate: 100
    burst: 200
    keyTTL: 10m
    redis:
      host: 127.0.0.1:6379
      type: node
