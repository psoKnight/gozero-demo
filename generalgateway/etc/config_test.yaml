Name: generalgateway
Host: 0.0.0.0
Port: 8080
Mode: test
Timeout: 3000
CpuThreshold: 900
Middlewares:
  Breaker: true
  Shedding: true
Greeter:
  Etcd:
    Hosts:
      - etcd:2379
    Key: greeter.rpc
  Timeout: 3000
  Middlewares:
    Breaker: true
Calculator:
  Etcd:
    Hosts:
      - etcd:2379
    Key: calculator.rpc
  Timeout: 3000
  Middlewares:
    Breaker: true
Resilience:
  HTTPRateLimit:
    enabled: true
    rate: 100
    burst: 200
    keyTTL: 10m
    redis:
      host: redis:6379
      type: node
