Name: calculator.rpc
ListenOn: 0.0.0.0:50053
Mode: pro
Health: true
CpuThreshold: 900
Middlewares:
  Breaker: true
Etcd:
  Hosts:
    - etcd.example.internal:2379
  Key: calculator.rpc
HealthServer:
  Address: 0.0.0.0:50054
Resilience:
  GRPCRateLimit:
    enabled: true
    rate: 200
    burst: 400
    keyTTL: 10m
    redis:
      host: redis.example.internal:6379
      type: node
