services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=gozero-demo-etcd
    environment:
      ETCDCTL_API: "3"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  greeter:
    build:
      context: ./greeter/docker
    expose:
      - "50051"
      - "50052"
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:50052/status.html"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  calculator:
    build:
      context: ./calculator/docker
    expose:
      - "50053"
      - "50054"
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:50054/status.html"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  generalgateway:
    build:
      context: ./generalgateway/docker
    ports:
      - "8080:8080"
    depends_on:
      etcd:
        condition: service_healthy
      greeter:
        condition: service_healthy
      calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/status.html"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

volumes:
  etcd-data:
